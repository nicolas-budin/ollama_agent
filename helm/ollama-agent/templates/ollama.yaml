{{- if .Values.ollama.enabled }}
{{- $fullName := include "ollama-agent.ollama.fullname" . }}
{{- if .Values.ollama.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "ollama-agent.ollama.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.ollama.persistence.accessMode }}
  {{- with .Values.ollama.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "ollama-agent.ollama.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "ollama-agent.ollama.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "ollama-agent.ollama.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Volume RWO : l'ancien pod doit libérer le PVC avant que le nouveau démarre.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ollama-agent.ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ollama-agent.ollama.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          {{- if .Values.ollama.pullModelOnStart }}
          # `ollama pull` a besoin du serveur : on le lance en fond, on attend
          # qu'il réponde, on tire le modèle (no-op s'il est déjà sur le PVC),
          # puis on attend le serveur en relayant SIGTERM pour un arrêt propre.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              pid=$!
              trap 'kill -TERM $pid' TERM INT
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$OLLAMA_MODEL" || echo "échec du pull de $OLLAMA_MODEL"
              wait $pid
          {{- end }}
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # OpenShift lance le conteneur avec un UID aléatoire non-root qui ne
            # peut pas écrire dans /root : on place ~/.ollama (clés + modèles)
            # sur le volume, rendu inscriptible via le fsGroup de la SCC.
            - name: HOME
              value: /data
            - name: OLLAMA_MODEL
              value: {{ .Values.model | quote }}
          ports:
            - name: api
              containerPort: 11434
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: api
          readinessProbe:
            {{- if .Values.ollama.pullModelOnStart }}
            # Prêt seulement une fois le modèle présent localement.
            exec:
              command: ["/bin/sh", "-c", "ollama show \"$OLLAMA_MODEL\" >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
            {{- else }}
            httpGet:
              path: /
              port: api
            {{- end }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /data/.ollama
      volumes:
        - name: models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
