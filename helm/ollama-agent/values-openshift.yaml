# Valeurs reproduisant openshift/deployment.yaml (cluster CRC, projet ollama-agent).
#   helm upgrade --install ollama-agent ./helm/ollama-agent -n ollama-agent \
#     -f helm/ollama-agent/values-openshift.yaml
# L'image reste construite par openshift/buildconfig.yaml (oc start-build, lancé
# par la CI), le chart ne gère que Deployment + Service + Route.

image:
  # ImageStream alimentée par le BuildConfig (registre interne du cluster).
  repository: image-registry.openshift-image-registry.svc:5000/ollama-agent/ollama-agent
  # Mis à jour automatiquement par la CI (.github/workflows/build.yml) : SHA
  # court du commit construit. Argo CD redéploie dès que cette valeur change.
  tag: "004abf2"
  # Chaque tag est unique et ne change jamais : inutile de retélécharger.
  pullPolicy: IfNotPresent

# IP LAN du Mac qui fait tourner Ollama (host.crc.testing ne route pas vers
# l'hôte sur ce setup, voir openshift/README.md). À ajuster si le DHCP change.
# added line.
ollamaUrl: http://192.168.1.119:11434/api/chat

# Pas de ServiceAccount dédié dans le déploiement actuel.
serviceAccount:
  create: false

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10

route:
  # Comme la Route actuelle : HTTP simple, host généré par OpenShift
  # (ollama-agent-ollama-agent.apps-crc.testing). Passer à true pour du HTTPS.
  tls:
    enabled: false
