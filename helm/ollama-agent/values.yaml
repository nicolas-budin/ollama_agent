# ⚠️ L'historique de conversation vit en mémoire dans le process (un seul
# historique partagé, voir ollama_client._history) : garder replicaCount à 1.
# Plusieurs replicas = plusieurs historiques divergents selon le pod qui répond.
replicaCount: 1

image:
  # Image construite depuis le Dockerfile à la racine du repo :
  #   docker build -t <registry>/ollama-agent:<tag> . && docker push ...
  repository: ollama-agent
  tag: ""  # par défaut : .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Modèle demandé à Ollama (variable OLLAMA_MODEL).
model: gemma4:26b

# URL de l'API chat d'un Ollama externe (variable OLLAMA_URL).
# Ignorée si ollama.enabled=true : on pointe alors sur le Service interne.
ollamaUrl: http://ollama:11434/api/chat

extraEnv: []
#  - name: FOO
#    value: bar

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8124

ingress:
  enabled: false
  className: ""
  # Les réponses sont streamées en SSE : désactiver le buffering du proxy et
  # allonger les timeouts, sinon la réponse arrive d'un bloc (ou est coupée).
  annotations: {}
  #  nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #  nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: ollama-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: ollama-agent-tls
  #    hosts:
  #      - ollama-agent.local

# --- OpenShift ---
# Route OpenShift (alternative à l'Ingress ci-dessus, n'activer que l'un des deux).
route:
  enabled: false
  host: ""  # vide : OpenShift génère <nom>-<projet>.<domaine-apps>
  # Timeout HAProxy par défaut = 30 s : trop court pour une longue réponse
  # streamée par un modèle 26b.
  timeout: 10m
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    memory: 256Mi

# Pas d'endpoint /health dédié : GET / sert l'index.html du build React.
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}
tolerations: []
affinity: {}

# --- Ollama embarqué (optionnel) ---
# Par défaut on suppose un Ollama existant joignable via ollamaUrl.
# Avec enabled=true, le chart déploie aussi Ollama (1 replica + PVC pour les
# modèles) et y télécharge `model` au démarrage.
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 11434
  # Télécharge `model` au démarrage du pod (en tâche de fond, idempotent).
  pullModelOnStart: true
  persistence:
    enabled: true
    # gemma4:26b pèse ~17 Go : prévoir large.
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}
  #  limits:
  #    nvidia.com/gpu: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
