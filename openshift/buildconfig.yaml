apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ollama-agent
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ollama-agent
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: ollama-agent:latest
