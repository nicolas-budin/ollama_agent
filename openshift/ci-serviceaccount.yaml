# Compte de service utilisé par le workflow GitHub Actions (.github/workflows/build.yml)
# pour lancer le build et donner un tag unique à l'image produite. Droits limités au strict
# nécessaire, dans le seul namespace ollama-agent. Voir openshift/CI.md.
#
#   oc apply -n ollama-agent -f openshift/ci-serviceaccount.yaml
#   oc extract secret/github-ci-token -n ollama-agent --keys=token --to=-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-ci
  namespace: ollama-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-ci
  namespace: ollama-agent
rules:
  # oc start-build --from-dir, oc logs -f, suivi du statut du build
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs]
    verbs: [get]
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs/instantiatebinary]
    verbs: [create]
  - apiGroups: [build.openshift.io]
    resources: [builds]
    verbs: [get, list, watch]
  - apiGroups: [build.openshift.io]
    resources: [builds/log]
    verbs: [get]
  # oc tag <imagestream>@<digest> <imagestream>:<sha>
  - apiGroups: [image.openshift.io]
    resources: [imagestreams, imagestreamimages]
    verbs: [get]
  - apiGroups: [image.openshift.io]
    resources: [imagestreamtags]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-ci
  namespace: ollama-agent
subjects:
  - kind: ServiceAccount
    name: github-ci
    namespace: ollama-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-ci
---
# Token longue durée du compte de service (rempli automatiquement par le cluster).
apiVersion: v1
kind: Secret
metadata:
  name: github-ci-token
  namespace: ollama-agent
  annotations:
    kubernetes.io/service-account.name: github-ci
type: kubernetes.io/service-account-token
